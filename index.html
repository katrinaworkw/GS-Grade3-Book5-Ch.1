<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港小學中文字詞大冒險</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --secondary: #06B6D4;
      --accent: #F59E0B;
      --success: #10B981;
      --danger: #EF4444;
      --bg-gradient: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 50%, #E0F2FE 100%);
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --font-chinese: 'DFKai-SB', 'BiauKai', '標楷體', '楷体', 'KaiTi', 'STKaiti', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: env(safe-area-inset-bottom, 24px);
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Top Navigation Header */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 12px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 1.8rem;
      line-height: 1;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-chinese);
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-badge {
      background: #F1F5F9;
      padding: 6px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }

    .stat-badge.score { color: #D97706; background: #FEF3C7; }
    .stat-badge.streak { color: #DC2626; background: #FEE2E2; }
    .stat-badge.sync { color: #059669; background: #D1FAE5; font-size: 0.8rem; }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.75);
      padding: 10px 16px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    .category-select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    .select-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select {
      width: 100%;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid #E2E8F0;
      background: var(--card-bg);
      font-family: var(--font-chinese), sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }

    .audio-settings {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-toggle-btn {
      padding: 6px 12px;
      border-radius: 10px;
      border: 2px solid var(--primary);
      background: #EEF2FF;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .speed-btn {
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .speed-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* Mode Switcher Tabs */
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .mode-btn {
      padding: 14px;
      border-radius: 16px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .mode-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .game-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* MODE 1: FLASHCARD VIEW */
    .flashcard-wrapper {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .flashcard-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #FFFFFF;
      padding: 8px 16px;
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }

    .toggle-speaker-mode {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #CBD5E1;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .toggle-switch.on { background: var(--success); }

    .toggle-handle {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch.on .toggle-handle { transform: translateX(20px); }

    .flashcard {
      width: 100%;
      height: 300px;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      border: 3px solid #EEF2FF;
    }

    .card-status-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card-status-badge.known { background: #DEF7EC; color: #03543F; }
    .card-status-badge.review { background: #FDE8E8; color: #9B1C1C; }

    .card-word {
      font-family: var(--font-chinese);
      font-size: 4.8rem;
      font-weight: bold;
      color: var(--text-main);
      letter-spacing: 4px;
      margin-bottom: 12px;
      text-align: center;
    }

    .speaker-pill-btn {
      background: #EEF2FF;
      color: var(--primary);
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .assessment-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .assess-btn {
      padding: 12px;
      border-radius: 16px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .assess-btn.know { background: #DEF7EC; color: #03543F; border: 2px solid #31C48D; }
    .assess-btn.dontknow { background: #FDE8E8; color: #9B1C1C; border: 2px solid #F98080; }

    .flashcard-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .nav-btn {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* MODE 2: LISTEN & CHOOSE WORD GAME */
    .listen-game-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .audio-prompt-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 16px 28px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 2px solid #E2E8F0;
      cursor: pointer;
      width: 100%;
      max-width: 480px;
    }

    .compact-speaker-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .audio-prompt-title { font-size: 1.1rem; font-weight: 900; color: var(--text-main); }
    .audio-prompt-sub { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .word-option-card {
      background: var(--card-bg);
      border-radius: 24px;
      min-height: 130px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 3px solid #E2E8F0;
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }

    .word-option-text {
      font-family: var(--font-chinese);
      font-size: 3.2rem;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
    }

    .card-key-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #F1F5F9;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-option-card.correct { background: #DEF7EC !important; border-color: var(--success) !important; }
    .word-option-card.wrong { background: #FDE8E8 !important; border-color: var(--danger) !important; }

    /* DASHBOARD TABLES & REVISION CARDS */
    .dashboard-panel {
      width: 100%;
      max-width: 820px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow-md);
      border: 1px solid #E2E8F0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clear-btn {
      background: #FEE2E2;
      color: #9B1C1C;
      border: 1px solid #F87171;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: #EF4444;
      color: #FFFFFF;
    }

    .revision-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .revision-chip {
      background: #FEE2E2;
      color: #9B1C1C;
      border: 1.5px solid #F87171;
      padding: 8px 16px;
      border-radius: 30px;
      font-family: var(--font-chinese);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #E2E8F0;
    }

    th { background: #F8FAFC; color: var(--text-muted); font-weight: 700; }
    td.word-td { font-family: var(--font-chinese); font-size: 1.2rem; font-weight: bold; }

    /* Delete Button in Table */
    .delete-row-btn {
      background: #FEE2E2;
      color: #EF4444;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .delete-row-btn:hover {
      background: #EF4444;
      color: #FFFFFF;
      transform: scale(1.1);
    }

    .footer-actions {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .answer-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .word-option-text { font-size: 2.2rem; }
      .card-word { font-size: 3.6rem; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">
        <span class="brand-icon">🇭🇰</span>
        <div class="brand-title">
          <h1>中文字詞大冒險</h1>
          <p id="subLangTitle">廣東話 (zh-HK) / 普通話 學習模組</p>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-badge sync" id="syncBadge">☁️ 雲端同步中...</div>
        <div class="stat-badge score" id="scoreDisplay">⭐ 0</div>
        <div class="stat-badge streak" id="streakDisplay">🔥 0</div>
      </div>
    </header>

    <div class="controls-bar">
      <div class="category-select-wrapper">
        <span class="select-label">學習主題：</span>
        <select id="categorySelect" onchange="changeCategory(this.value)">
          <option value="all">🌟 全部字詞 (115字)</option>
          <option value="housing">🏠 房屋類型 (屋邨/村屋/唐樓...)</option>
          <option value="facilities">🏙️ 環境設施 (街市/商場/會所...)</option>
          <option value="history">📜 昔今演變 (石硤尾/擠迫/走廊...)</option>
          <option value="smart">🤖 智能家居 (體重計/清新機...)</option>
          <option value="verbs">📖 常用詞彙 (面對/解決/不斷...)</option>
        </select>
      </div>

      <div class="audio-settings">
        <button class="lang-toggle-btn" id="langToggleBtn" onclick="toggleLanguage()">🗣️ 粵語 (zh-HK)</button>
        <button class="speed-btn" onclick="setSpeed(0.7, this)">0.7x 慢</button>
        <button class="speed-btn active" onclick="setSpeed(0.9, this)">0.9x 正</button>
      </div>
    </div>

    <div class="mode-switcher">
      <button class="mode-btn active" id="modeBtnListen" onclick="switchMode('listen')">
        🎧 聽音選字 (遊戲)
      </button>
      <button class="mode-btn" id="modeBtnCard" onclick="switchMode('card')">
        🎴 標楷體字詞卡
      </button>
    </div>

    <div class="game-viewport">
      <!-- MODE 1: LISTEN & CHOOSE WORD -->
      <div class="listen-game-wrapper" id="listenGameView">
        <div class="audio-prompt-card" onclick="playCurrentTargetAudio()">
          <div class="compact-speaker-icon">🔊</div>
          <div class="audio-prompt-text">
            <span class="audio-prompt-title" id="audioPromptTitle">點擊聽廣東話發音</span>
            <span class="audio-prompt-sub">請選出字數相符的正確字詞 (按 1-4)</span>
          </div>
        </div>

        <div class="answer-grid" id="answerGrid"></div>
      </div>

      <!-- MODE 2: FLASHCARD VIEW -->
      <div class="flashcard-wrapper" id="flashcardView" style="display: none;">
        <div class="flashcard-header-bar">
          <div class="toggle-speaker-mode" onclick="toggleAutoSpeaker()">
            <span>自動發音模式：</span>
            <div class="toggle-switch on" id="speakerToggleSwitch">
              <div class="toggle-handle"></div>
            </div>
          </div>
        </div>

        <div class="flashcard">
          <div class="card-status-badge" id="cardStatusBadge">未記錄</div>
          <div class="card-word" id="cardWordText">香港</div>
          <button class="speaker-pill-btn" onclick="speakCurrentCard()">🔊 點擊發音</button>
        </div>

        <div class="assessment-buttons">
          <button class="assess-btn know" onclick="markCurrentCard(true)">✅ 我學會了</button>
          <button class="assess-btn dontknow" onclick="markCurrentCard(false)">❌ 還需複習</button>
        </div>

        <div class="flashcard-nav">
          <button class="nav-btn" onclick="prevCard()">上一張</button>
          <button class="nav-btn" onclick="nextCard()">下一張</button>
        </div>
      </div>
    </div>

    <!-- MAIN PAGE DASHBOARD -->
    <div class="dashboard-panel">
      <div class="section-card">
        <div class="section-header">
          <div class="section-title">📌 待複習字詞 (按字詞可跳至字詞卡)：</div>
        </div>
        <div class="revision-chips-container" id="revisionChipsContainer">
          <span style="color: var(--text-muted); font-size: 0.85rem;">暫無待複習字詞，可在字詞卡按下 ❌ 來加入！</span>
        </div>
      </div>

      <div class="section-card">
        <div class="section-header">
          <div class="section-title">📝 聽音選字 - 錯題記錄表：</div>
          <button class="clear-btn" onclick="clearAllWrongRecords()">清空所有記錄</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>正確目標字詞</th>
                <th>誤選字詞</th>
                <th>時間</th>
                <th style="width: 40px; text-align: center;">刪除</th>
              </tr>
            </thead>
            <tbody id="wrongAnswerTableBody">
              <tr>
                <td colspan="4" style="text-align: center; color: var(--text-muted);">暫無錯題記錄，加油！</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="text-btn" onclick="customWordsPrompt()">+ 自訂加入新詞語</button>
    </div>
  </div>

  <script>
    // === JSONBIN.IO CLOUD SYNC CONFIGURATION ===
    const JSONBIN_BIN_ID = "6ad880fcffd5d160537ec35a";
    const JSONBIN_API_KEY = "$2a$10$F9Xaygh09D781X3wifsgFueGCSAbHaKqD34xld1wTCdVqGGpUXRuO";

    let wordStatusMap = {};
    let wrongAnswerRecords = [];
    let score = 0;

    async function loadCloudData() {
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        if (response.ok) {
          const result = await response.json();
          const data = result.record;
          if (data) {
            wordStatusMap = data.wordStatusMap || {};
            wrongAnswerRecords = data.wrongAnswerRecords || [];
            score = data.score || 0;
            renderRevisionChips();
            renderWrongAnswerTable();
            updateStats();
          }
          document.getElementById('syncBadge').innerText = '☁️ 雲端已同步';
        } else {
          document.getElementById('syncBadge').innerText = '💾 本地模式';
        }
      } catch (e) {
        document.getElementById('syncBadge').innerText = '💾 本地模式';
      }
    }

    async function saveCloudDataOnInteraction() {
      const dataToSave = {
        wordStatusMap: wordStatusMap,
        wrongAnswerRecords: wrongAnswerRecords,
        score: score,
        lastUpdated: Date.now()
      };

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(dataToSave)
        });
        document.getElementById('syncBadge').innerText = '☁️ 雲端已同步';
      } catch (e) {
        document.getElementById('syncBadge').innerText = '⚠️ 同步失敗';
      }
    }

    const VOCAB_DATA = {
      housing: ["香港", "房屋", "類型", "公營", "私營", "公共屋邨", "居者有其屋計劃屋苑", "私人屋苑", "獨立屋", "村屋", "唐樓", "座數", "樓數"],
      facilities: ["環境", "特色", "密集", "地區", "郊區", "市區", "設施", "街市", "商場", "會所", "兒童遊樂場", "停車場", "升降機", "管理處", "郵箱"],
      history: ["年代", "石硤尾", "居民", "家園", "無家可歸", "居所", "時期", "高空", "公用", "廁所", "浴室", "單位", "獨立", "學校", "改善", "舒適", "昔日", "面積", "雙人牀", "擠迫", "設備", "廚房", "走廊", "生火", "煮食", "衛生", "乾淨", "供水", "惡劣", "鄰里關係", "生活", "家庭", "鄰居", "玩耍", "疏離", "樓價", "高昂", "細小", "家具", "節省空間"],
      smart: ["智能", "家居", "體重計", "自動", "識別", "用戶", "身份", "健康", "建議", "加濕機", "空氣清新機", "質素", "啟動", "保持"],
      verbs: ["甚麼", "哪些", "政府", "興建", "方面", "一般", "較多", "較少", "位於", "遠離", "常見", "怎樣", "發展", "面對", "問題", "解決", "失去", "提供", "不同", "不斷", "向", "再", "及", "以後", "等", "變得", "越", "只", "相等於", "沒有", "需要", "易", "意外", "每層", "兩", "供", "使用", "而且", "較", "像", "時常", "見面", "小孩", "切合", "特點", "多種", "功能", "未來", "例子", "它們", "人們", "變差", "良好"]
    };

    let currentCategory = 'all';
    let currentVocabularyList = [];
    let streak = 0;
    let speechSpeed = 0.9;
    let speechLang = 'zh-HK';
    let currentMode = 'listen';

    let autoPlaySpeakerMode = true;
    let currentListenTarget = "";
    let currentListenOptions = [];
    let currentCardIndex = 0;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudioCtx() { if (!audioCtx) audioCtx = new AudioContext(); }

    function playBeep(freq, type = 'sine', duration = 0.15) {
      try {
        initAudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSoundEffect(isCorrect) {
      if (isCorrect) {
        playBeep(523.25, 'triangle', 0.1);
        setTimeout(() => playBeep(659.25, 'triangle', 0.1), 80);
        setTimeout(() => playBeep(783.99, 'triangle', 0.2), 160);
      } else {
        playBeep(220, 'sawtooth', 0.2);
        setTimeout(() => playBeep(180, 'sawtooth', 0.25), 150);
      }
    }

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.rate = speechSpeed;
      utterance.lang = speechLang;
      window.speechSynthesis.speak(utterance);
    }

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function toggleAutoSpeaker() {
      autoPlaySpeakerMode = !autoPlaySpeakerMode;
      document.getElementById('speakerToggleSwitch').classList.toggle('on', autoPlaySpeakerMode);
    }

    function toggleLanguage() {
      const btn = document.getElementById('langToggleBtn');
      const title = document.getElementById('audioPromptTitle');
      const subTitle = document.getElementById('subLangTitle');

      if (speechLang === 'zh-HK') {
        speechLang = 'zh-CN';
        btn.innerHTML = '🗣️ 普通話 (zh-CN)';
        title.innerText = '點擊聽普通話發音';
        subTitle.innerText = '普通話 (zh-CN) 學習模組';
      } else {
        speechLang = 'zh-HK';
        btn.innerHTML = '🗣️ 粵語 (zh-HK)';
        title.innerText = '點擊聽廣東話發音';
        subTitle.innerText = '廣東話 (zh-HK) 學習模組';
      }

      if (currentMode === 'listen') {
        playCurrentTargetAudio();
      } else if (autoPlaySpeakerMode) {
        speakCurrentCard();
      }
    }

    function loadVocabularyList() {
      if (currentCategory === 'all') {
        currentVocabularyList = Object.values(VOCAB_DATA).flat();
      } else {
        currentVocabularyList = [...(VOCAB_DATA[currentCategory] || [])];
      }
      currentVocabularyList = shuffleArray([...new Set(currentVocabularyList)]);
    }

    function changeCategory(val) {
      currentCategory = val;
      loadVocabularyList();
      currentCardIndex = 0;
      if (currentMode === 'listen') {
        setupNewListenQuestion();
      } else {
        updateFlashcard();
      }
    }

    function setSpeed(spd, btn) {
      speechSpeed = spd;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('modeBtnListen').classList.toggle('active', mode === 'listen');
      document.getElementById('modeBtnCard').classList.toggle('active', mode === 'card');

      document.getElementById('listenGameView').style.display = mode === 'listen' ? 'flex' : 'none';
      document.getElementById('flashcardView').style.display = mode === 'card' ? 'flex' : 'none';

      if (mode === 'listen') {
        setupNewListenQuestion();
      } else {
        updateFlashcard();
      }
    }

    /* LISTEN & CHOOSE WORD GAME */
    function setupNewListenQuestion() {
      if (currentVocabularyList.length === 0) return;

      const randomIndex = Math.floor(Math.random() * currentVocabularyList.length);
      currentListenTarget = currentVocabularyList[randomIndex];
      const targetLength = currentListenTarget.length;

      let allFullVocab = Object.values(VOCAB_DATA).flat();
      let sameLengthCandidates = allFullVocab.filter(w => w.length === targetLength && w !== currentListenTarget);
      sameLengthCandidates = [...new Set(sameLengthCandidates)];

      if (sameLengthCandidates.length < 3) {
        let remaining = allFullVocab.filter(w => w !== currentListenTarget);
        sameLengthCandidates = [...sameLengthCandidates, ...remaining];
      }

      const distractors = shuffleArray(sameLengthCandidates).slice(0, 3);
      currentListenOptions = shuffleArray([currentListenTarget, ...distractors]);

      const grid = document.getElementById('answerGrid');
      grid.innerHTML = '';

      currentListenOptions.forEach((word, idx) => {
        const card = document.createElement('div');
        card.className = 'word-option-card';
        card.onclick = () => checkAnswer(word, card);

        card.innerHTML = `
          <span class="card-key-badge">${idx + 1}</span>
          <span class="word-option-text">${word}</span>
        `;
        grid.appendChild(card);
      });

      setTimeout(() => { playCurrentTargetAudio(); }, 300);
    }

    function playCurrentTargetAudio() { speakWord(currentListenTarget); }

    function checkAnswer(selectedWord, cardElement) {
      if (cardElement.classList.contains('correct') || cardElement.classList.contains('wrong')) return;

      if (selectedWord === currentListenTarget) {
        cardElement.classList.add('correct');
        playSoundEffect(true);
        score += 10;
        streak += 1;

        if (streak % 5 === 0) {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
        }

        updateStats();
        saveCloudDataOnInteraction();

        setTimeout(() => { setupNewListenQuestion(); }, 1000);
      } else {
        cardElement.classList.add('wrong');
        playSoundEffect(false);
        streak = 0;
        updateStats();

        // 1. Record in Matching Game Wrong Answer Table
        logWrongAnswer(currentListenTarget, selectedWord);

        // 2. Directly add BOTH correct target word and wrong chosen word to Revision List
        wordStatusMap[currentListenTarget] = 'dontknow';
        wordStatusMap[selectedWord] = 'dontknow';
        renderRevisionChips();

        // 3. Sync to Cloud Immediately
        saveCloudDataOnInteraction();
      }
    }

    function logWrongAnswer(target, selected) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      wrongAnswerRecords.unshift({ target, selected, time: timeStr });
      renderWrongAnswerTable();
    }

    function deleteWrongRecord(index) {
      wrongAnswerRecords.splice(index, 1);
      renderWrongAnswerTable();
      saveCloudDataOnInteraction();
    }

    function clearAllWrongRecords() {
      if (wrongAnswerRecords.length === 0) return;
      if (confirm("確定要清空所有錯題記錄嗎？")) {
        wrongAnswerRecords = [];
        renderWrongAnswerTable();
        saveCloudDataOnInteraction();
      }
    }

    function renderWrongAnswerTable() {
      const tbody = document.getElementById('wrongAnswerTableBody');
      if (wrongAnswerRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">暫無錯題記錄，加油！</td></tr>`;
        return;
      }

      tbody.innerHTML = wrongAnswerRecords.slice(0, 15).map((rec, idx) => `
        <tr>
          <td class="word-td" style="color: var(--success);">${rec.target}</td>
          <td class="word-td" style="color: var(--danger);">${rec.selected}</td>
          <td style="color: var(--text-muted); font-size: 0.8rem;">${rec.time}</td>
          <td style="text-align: center;">
            <button class="delete-row-btn" onclick="deleteWrongRecord(${idx})" title="刪除此記錄">✕</button>
          </td>
        </tr>
      `).join('');
    }

    function updateStats() {
      document.getElementById('scoreDisplay').innerText = `⭐ ${score}`;
      document.getElementById('streakDisplay').innerText = `🔥 ${streak}`;
    }

    /* FLASHCARD & REVISION TRACKING */
    function updateFlashcard() {
      if (currentVocabularyList.length === 0) return;
      const word = currentVocabularyList[currentCardIndex];
      document.getElementById('cardWordText').innerText = word;

      const badge = document.getElementById('cardStatusBadge');
      const status = wordStatusMap[word];
      if (status === 'know') {
        badge.innerText = '✅ 我學會了';
        badge.className = 'card-status-badge known';
      } else if (status === 'dontknow') {
        badge.innerText = '❌ 待複習';
        badge.className = 'card-status-badge review';
      } else {
        badge.innerText = '未記錄';
        badge.className = 'card-status-badge';
      }

      if (autoPlaySpeakerMode) speakWord(word);
    }

    function speakCurrentCard() {
      const word = currentVocabularyList[currentCardIndex];
      speakWord(word);
    }

    function markCurrentCard(isKnown) {
      const word = currentVocabularyList[currentCardIndex];
      wordStatusMap[word] = isKnown ? 'know' : 'dontknow';
      updateFlashcard();
      renderRevisionChips();
      saveCloudDataOnInteraction();
    }

    function renderRevisionChips() {
      const container = document.getElementById('revisionChipsContainer');
      const reviewWords = Object.keys(wordStatusMap).filter(w => wordStatusMap[w] === 'dontknow');

      if (reviewWords.length === 0) {
        container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">暫無待複習字詞，可在字詞卡按下 ❌ 來加入！</span>`;
        return;
      }

      container.innerHTML = reviewWords.map(word => `
        <div class="revision-chip" onclick="jumpToFlashcard('${word}')">
          <span>${word}</span>
          <span style="font-size: 0.8rem;">🔍</span>
        </div>
      `).join('');
    }

    function jumpToFlashcard(word) {
      switchMode('card');
      if (!currentVocabularyList.includes(word)) {
        document.getElementById('categorySelect').value = 'all';
        changeCategory('all');
      }

      const idx = currentVocabularyList.indexOf(word);
      if (idx !== -1) {
        currentCardIndex = idx;
        updateFlashcard();
      }
    }

    function nextCard() {
      currentCardIndex = (currentCardIndex + 1) % currentVocabularyList.length;
      updateFlashcard();
    }

    function prevCard() {
      currentCardIndex = (currentCardIndex - 1 + currentVocabularyList.length) % currentVocabularyList.length;
      updateFlashcard();
    }

    function customWordsPrompt() {
      const input = prompt("請輸入自訂字詞（請用空格或逗號分隔）：");
      if (input && input.trim()) {
        const words = input.split(/[\s,，]+/).filter(w => w.trim().length > 0);
        if (words.length > 0) {
          VOCAB_DATA['custom'] = words;
          const select = document.getElementById('categorySelect');
          
          let customOpt = select.querySelector('option[value="custom"]');
          if (!customOpt) {
            customOpt = document.createElement('option');
            customOpt.value = 'custom';
            select.appendChild(customOpt);
          }
          customOpt.innerText = `✨ 自訂字詞 (${words.length}個)`;
          select.value = 'custom';
          changeCategory('custom');
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (currentMode === 'listen') {
        if (['1', '2', '3', '4'].includes(e.key)) {
          const idx = parseInt(e.key) - 1;
          const cards = document.querySelectorAll('.word-option-card');
          if (cards[idx]) cards[idx].click();
        } else if (e.code === 'Space') {
          e.preventDefault();
          playCurrentTargetAudio();
        }
      } else if (currentMode === 'card') {
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.code === 'Space') {
          e.preventDefault();
          speakCurrentCard();
        }
      }
    });

    loadCloudData();
    loadVocabularyList();
    setupNewListenQuestion();
  </script>
</body>
</html>
